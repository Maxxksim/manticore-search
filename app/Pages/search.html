<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Searching with auto suggestions</title>
</head>
<body class="bg-blue-100">
<div class="flex flex-row justify-center mt-24 mx-5">
    <div class="flex flex-col ">
        <div class="relative">
            <div class="border rounded-md relative">
                <input type="text" class="w-full md:min-w-md p-3 pr-24" id="search"
                       placeholder="Start typing for suggesting..."
                       autocomplete="off">
                <button id="search-btn"
                        class="p-3 index-100 absolute right-0 border-l top-0 h-full bg-blue-100 rounded-r-md hover:bg-blue-300">
                    Search
                </button>
            </div>
            <div id="suggestion-result"
                 class="absolute left-0 top-full z-20 w-full border rounded-md bg-white hidden max-h-100 overflow-auto">
            </div>
        </div>
        <div id="search-result"
             class="border rounded-md max-h-100 mt-25 bg-gray-500 text-center text-white p-20 hidden">
        </div>

    </div>
</div>
</body>
</html>

<script>
  const suggestionResult = document.getElementById('suggestion-result')
  const searchResult = document.getElementById('search-result')
  const searchInput = document.getElementById('search')
  const searchBtn = document.getElementById('search-btn')
  let timer
  let abortController

  async function makeRequest (url, signal) {

    try {
      const response = await fetch(url, { signal })

      if (!response.ok) {
        console.log('Request failed:', await response.text())
        return []
      }

      return await response.json()

    } catch (error) {

      if (error.name === 'AbortError') {
        return null
      }
      console.error('Request error:', error)
      return []
    }
  }

  function suggestCountry (keywords) {
    abortController?.abort()
    abortController = new AbortController()

    return makeRequest('/suggest?keywords=' + encodeURIComponent(keywords), abortController.signal)
  }

  async function suggestionHandler (event) {
    const inputValue = event.target.value

    if (inputValue.trim() === '') {
      abortController?.abort()
      suggestionResult.replaceChildren()
      switchVisibility(suggestionResult, 'hidden', 'visible')
      return
    }
    const result = await suggestCountry(inputValue)

    if (result === null) {
      return
    }

    if (result.length === 1) {
      searchInput.dataset.country = result[0]['id']
    } else {
      delete searchInput.dataset.country
    }

    suggestionResult.replaceChildren()

    if (result.length === 0) {
      switchVisibility(suggestionResult, 'hidden', 'visible')
      return
    }
    switchVisibility(suggestionResult, 'visible', 'hidden')

    result.forEach(function (country) {
      const divElement = document.createElement('div')
      const spanElement = document.createElement('span')

      spanElement.textContent = country['name']
      divElement.append(spanElement)
      divElement.dataset.country = country['id']
      divElement.className = 'p-1 hover:bg-gray-300 rounded cursor-pointer'

      suggestionResult.appendChild(divElement)
    })
  }

  function switchVisibility (element, add, remove) {
    element.classList.add(add)
    element.classList.remove(remove)
  }

  searchInput.addEventListener('input', function (event) {
    debounce(() => suggestionHandler(event), 250)
  })
  searchInput.addEventListener('focus', function (event) {
    debounce(() => suggestionHandler(event), 250)
  })

  document.addEventListener('click', function (event) {
    const insideSearchInput = searchInput.contains(event.target)
    const insideSuggestionList = suggestionResult.contains(event.target)

    if (!insideSuggestionList && !insideSearchInput) {
      clearTimeout(timer)
      abortController?.abort()
      suggestionResult.replaceChildren()
      switchVisibility(suggestionResult, 'hidden', 'visible')
    }
  })

  suggestionResult.addEventListener('click', function (event) {
    const closestElement = event.target.closest('[data-country]')

    if (!closestElement) {
      return
    }
    searchInput.value = closestElement.textContent
    searchInput.dataset.country = closestElement.dataset.country
    clearTimeout(timer)
    abortController?.abort()
    suggestionResult.replaceChildren()
    switchVisibility(suggestionResult, 'hidden', 'visible')
  })

  searchBtn.addEventListener('click', async function () {
    searchResult.replaceChildren()
    const result = await makeRequest('/search?countryId=' + encodeURIComponent(searchInput.dataset.country))

    if (result.error) {
      switchVisibility(searchResult, 'visible', 'hidden')
      const spanElement = document.createElement('span')
      spanElement.textContent = result.error
      searchResult.appendChild(spanElement)
      return
    }
    switchVisibility(searchResult, 'visible', 'hidden')
    const spanElement = document.createElement('span')
    spanElement.textContent = 'Country: ' + result.data.name
    searchResult.appendChild(spanElement)

  })

  function debounce (callback, delay) {
    clearTimeout(timer)
    timer = setTimeout(() => {
      callback()
    }, delay)
  }
</script>
