<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Searching with auto suggestions</title>
</head>
<body class="bg-blue-100">
<div class="flex flex-row justify-center mt-24 mx-5">
    <div class="flex flex-col ">
        <div class="border rounded-md relative">
            <input type="text" class="w-full md:min-w-md p-3 pr-24" id="search" placeholder="Start typing for suggesting..."
                   autocomplete="off">
            <button class="p-3 index-100 absolute right-0 border-l top-0 h-full bg-blue-100 rounded-r-md hover:bg-blue-300">
                Search
            </button>
        </div>
        <div id="result" class="border rounded-md bg-white hidden max-h-100 overflow-auto">

        </div>
    </div>
</div>
</body>
</html>

<script>
  const suggestionResult = document.getElementById('result')
  const searchInput = document.getElementById('search')

  async function suggestCountry (keywords) {

    try {
      const response = await fetch(
        '/suggest?keywords=' + encodeURIComponent(keywords)
      )

      if (!response.ok) {
        console.log('Request failed:', response)
        return []
      }

      return await response.json()

    } catch (error) {

      console.log('Suggesting country failed:', error.message)
      return []
    }
  }

  async function suggestionHandler (event) {
    const inputValue = event.target.value
    suggestionResult.replaceChildren()

    if (inputValue.trim() === '') {
      switchVisibility('hidden', 'visible')
      return
    }
    const result = await suggestCountry(inputValue)

    if (result.length === 0) {
      switchVisibility('hidden', 'visible')
      return
    }
    switchVisibility('visible', 'hidden')

    result.forEach(function (country) {
      const divElement = document.createElement('div')
      const spanElement = document.createElement('span')

      spanElement.textContent = country
      divElement.append(spanElement)
      divElement.dataset.country = country
      divElement.className = 'p-1 hover:bg-gray-300 rounded cursor-pointer'

      suggestionResult.appendChild(divElement)
    })
  }

  function switchVisibility (add, remove) {
    suggestionResult.classList.add(add)
    suggestionResult.classList.remove(remove)
  }

  searchInput.addEventListener('input', suggestionHandler)
  searchInput.addEventListener('focus', suggestionHandler)

  document.addEventListener('click', function (event) {
    const insideSearchInput = searchInput.contains(event.target)
    const insideSuggestionList = suggestionResult.contains(event.target)

    if (!insideSuggestionList && !insideSearchInput) {
      suggestionResult.replaceChildren()
      switchVisibility('hidden', 'visible')
    }
  })

  suggestionResult.addEventListener('click', function (event) {
    const closestElement = event.target.closest('[data-country]')

    if (!closestElement) {
      return
    }
    searchInput.value = closestElement.dataset.country
    suggestionResult.replaceChildren()
    switchVisibility('hidden', 'visible')
  })
</script>
