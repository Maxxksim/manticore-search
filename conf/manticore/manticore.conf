#!/bin/bash

cat <<EOF
table countries {
        path = /var/lib/manticore/country
        source = countries
        min_infix_len = 1
}

source countries {
        type = mysql
        sql_host = $DB_HOST
        sql_user = $DB_USERNAME
        sql_pass = $DB_PASSWORD
        sql_db = $DB_DATABASE
        sql_query_pre = SET NAMES utf8
        sql_query =  SELECT id, name FROM countries
        sql_field_string = name
}

searchd {
        listen = 9308:http
        pid_file = /var/run/manticore/searchd.pid
}
EOF