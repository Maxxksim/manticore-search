table countries {
        path = /var/lib/manticore/country
        source = countries
        min_infix_len = 1
}

source countries {
        type = mysql
        sql_host = db
        sql_user = username
        sql_pass = password
        sql_db = manticore
        sql_query_pre = SET NAMES utf8
        sql_query =  SELECT id, country FROM countries
        sql_field_string = country
}

searchd {
        listen = 9308:http
        pid_file = /var/run/manticore/searchd.pid
}